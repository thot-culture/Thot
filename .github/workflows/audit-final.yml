name: Audit final — navigateur et mesures

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    # Image explicite pour stabiliser l’environnement Chromium de l’audit.
    runs-on: ubuntu-24.04
    # Même version que les paquets Python/Node ; navigateurs et bibliothèques inclus.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Autoriser le dépôt monté dans le conteneur
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances de test
        run: |
          python -m pip install -r requirements-browser.txt
          npm install --prefix "$RUNNER_TEMP/thot-audit" playwright@1.62.0 axe-core@4.10.3 lighthouse@12.8.2
          "$RUNNER_TEMP/thot-audit/node_modules/.bin/playwright" install chromium
      - name: Vérifier Chromium et ses dépendances préinstallées
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              print('CHROMIUM_PREFLIGHT', browser.version)
              browser.close()
          PY
      - name: Captures de référence PR #22
        env:
          THOT_OUTPUT_DIR: ${{ runner.temp }}/evidence/before
        run: python scripts/audit-final-before.py
      - name: Sorties attendues des générateurs (artefact, sans commit ni déploiement)
        run: |
          python scripts/build-explorer-reconstruction.py
          python scripts/update-article-editorial.py --write
          python scripts/sync-publication.py --write
          python scripts/update-reading-times.py
          python scripts/site_chrome.py
          git diff --output="$RUNNER_TEMP/generated.patch"
          python -c 'import subprocess,json; names=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines(); print("GENERATED_FILES_JSON "+json.dumps({p:open(p,encoding="utf-8").read() for p in names},ensure_ascii=True))'
          git diff --exit-code
      - name: Générateurs et contrôles actuels
        run: |
          node scripts/validate.mjs
          python scripts/test-publication-integration.py --browser --output "$RUNNER_TEMP/evidence/publication-integration.json"
      - name: Recettes Explorer complètes sur fixtures
        run: |
          python scripts/test-explorer-reconstruction.py --browser --out "$RUNNER_TEMP/evidence/explorer-reconstruction"
          python scripts/test-explorer-finitions.py --out "$RUNNER_TEMP/evidence/explorer-finitions"
          python scripts/test-explorer-recette-finale.py --out "$RUNNER_TEMP/evidence/explorer-finale"
      - name: Affichage, clavier, WCAG et parties complètes
        env:
          NODE_PATH: ${{ runner.temp }}/thot-audit/node_modules
          THOT_OUTPUT_DIR: ${{ runner.temp }}/evidence/after
        run: node scripts/audit-final-browser.cjs
      - name: Navigation Atlas, onze pièces Aral et stockage persistant
        env:
          NODE_PATH: ${{ runner.temp }}/thot-audit/node_modules
          THOT_OUTPUT_DIR: ${{ runner.temp }}/evidence/functional
        run: |
          python scripts/preview.py > "$RUNNER_TEMP/preview.log" 2>&1 &
          node scripts/test-site-browser.cjs
      - name: Cartes P1, cinq largeurs et haute densité
        run: python scripts/test-p1-cartes-browser.py --output "${{ runner.temp }}/evidence/p1-cartes"
      - name: Article sophistes, parcours et accessibilité
        env:
          NODE_PATH: ${{ runner.temp }}/thot-audit/node_modules
          THOT_OUTPUT_DIR: ${{ runner.temp }}/evidence/sophistes
        run: node scripts/test-sophistes-browser.cjs
      - name: Performance mobile de laboratoire
        if: always()
        env:
          NODE_PATH: ${{ runner.temp }}/thot-audit/node_modules
          THOT_OUTPUT_DIR: ${{ runner.temp }}/evidence/performance
        run: node scripts/audit-final-performance.cjs
      - name: Liens externes et production (lecture seule)
        if: always()
        env:
          THOT_OUTPUT_DIR: ${{ runner.temp }}/evidence/links
        run: python scripts/audit-final-links.py
      - name: Résumé des résultats et planches de contrôle
        if: always()
        env:
          THOT_EVIDENCE: ${{ runner.temp }}/evidence
        run: python scripts/audit-final-summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-final-preuves
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/generated.patch
          retention-days: 30

  windows-browser:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances navigateur Windows
        run: |
          npm install --prefix "$env:RUNNER_TEMP/thot-audit" playwright@1.62.0
          & "$env:RUNNER_TEMP/thot-audit/node_modules/.bin/playwright.cmd" install chromium
      - name: Recette HTTP native Windows
        env:
          NODE_PATH: ${{ runner.temp }}/thot-audit/node_modules
          THOT_OUTPUT_DIR: ${{ runner.temp }}/evidence-windows
        run: python scripts/run-browser-recipe.py
      - name: Résumé Windows
        if: always()
        run: |
          if (Test-Path "$env:RUNNER_TEMP/evidence-windows/recette-site.json") {
            Get-Content "$env:RUNNER_TEMP/evidence-windows/recette-site.json"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-final-windows
          path: ${{ runner.temp }}/evidence-windows
          retention-days: 30
