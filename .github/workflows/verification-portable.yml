name: Vérification portable

on:
  push:
    branches: [main, work/stabilisation-retrait-explorer-20261026]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation:
    name: Génération sur ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check HEAD^ HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tools.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validation complète sans navigateur
        run: node scripts/validate.mjs
