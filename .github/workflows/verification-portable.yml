name: Vérification portable

on:
  push:
    branches: [main, work/stabilisation-retrait-explorer-20261026]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation:
    name: Génération sur ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tools.txt
      - run: python scripts/test-portabilite.py
